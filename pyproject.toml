[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cccphe"
version = "0.1.0"
description = "Directed spatial CCC input and downstream niche interpretation"
requires-python = ">=3.11"
dependencies = [
  "anndata>=0.12",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "igraph>=0.11",
  "leidenalg>=0.10",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
notebook = ["ipykernel>=6", "seaborn>=0.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
