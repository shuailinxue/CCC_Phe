[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cccphe"
version = "0.1.0"
description = "ST-anchored phenotype-associated cell-cell communication analysis"
requires-python = ">=3.10"
dependencies = [
  "anndata>=0.12",
  "commot>=0.0.3",
  "lifelines>=0.30",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "pyyaml>=6",
  "scanpy>=1.11",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "torch>=2.1",
  "zarr>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
